# Least-privilege RBAC (REQUIREMENTS.md K8S-08): get/list/watch the one
# configured ConfigMap only. Apply with:
#   kubectl apply -f manifests/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentstrata-config-reader
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentstrata-config-reader
  namespace: default
subjects:
  - kind: ServiceAccount
    name: agentstrata
    namespace: default
roleRef:
  kind: Role
  name: agentstrata-config-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentstrata
  namespace: default
