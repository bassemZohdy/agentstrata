# Illustrative Deployment + Service (REQUIREMENTS.md K8S-08).
# - API-01/02 probes (/healthz liveness, /readyz readiness).
# - Security context (non-root, read-only rootfs, drop capabilities).
# - Exactly one worker (CNT-08); memory/file storage => one replica
#   (SES-01/SES-04); Redis/Postgres storage => multi-replica safe.
# - Runtime authentication via API key secret (SEC-01): the API key is
#   mounted as a file and referenced by AGENT_SERVER_AUTH_APIKEYFILE.
# - The watched ConfigMap holds the tier-8 overlay in key `agent.yaml`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentstrata
  namespace: default
spec:
  replicas: 1 # memory/file storage: MUST stay 1 (SES-01)
  selector:
    matchLabels:
      app: agentstrata
  template:
    metadata:
      labels:
        app: agentstrata
    spec:
      serviceAccountName: agentstrata
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 0
        fsGroup: 0
      containers:
        - name: runtime
          image: agentstrata:latest
          imagePullPolicy: IfNotPresent
          args: []
          env:
            - name: AGENT_K8S_ENABLED
              value: "true"
            - name: AGENT_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AGENT_K8S_NAME
              value: agentstrata-config
            - name: AGENT_SERVER_AUTH_MODE
              value: apiKey
            - name: AGENT_SERVER_AUTH_APIKEYFILE
              value: /etc/agent-secrets/api-key
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/agent
              readOnly: true
            - name: secrets
              mountPath: /etc/agent-secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: agentstrata-config
        - name: secrets
          secret:
            secretName: agentstrata-api-key
            defaultMode: 0400
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agentstrata
  namespace: default
spec:
  selector:
    app: agentstrata
  ports:
    - port: 8080
      targetPort: 8080
      name: http
