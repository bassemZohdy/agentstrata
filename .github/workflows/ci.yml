name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Install locked dev dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -r requirements-dev.lock --require-hashes
      - name: Manifest sync (requirements.txt vs pyproject [project])
        run: .venv/bin/python scripts/check-manifest-sync.py
      - name: Ruff lint
        run: .venv/bin/python -m ruff check app scripts
      - name: Ruff format check
        run: .venv/bin/python -m ruff format --check app scripts
      - name: mypy type-check
        run: .venv/bin/python -m mypy app scripts
      - name: mypy type-check (tests)
        run: .venv/bin/python -m mypy tests
      - name: Schema zero-diff (SCH-02, DEL-02)
        run: |
          .venv/bin/python scripts/gen-schemas.py
          git diff --exit-code -- schemas/

  lockfile:
    name: Lockfile hash verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Verify lock hashes (STACK-01)
        run: ./scripts/verify-lock.sh

  test:
    name: Tests (placeholder)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Install locked dev dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -r requirements-dev.lock --require-hashes
      - name: Run tests
        run: .venv/bin/python -m pytest

  storage-contract-real:
    name: Storage contract suite (real Redis + Postgres)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentbase
          POSTGRES_PASSWORD: agentbase
          POSTGRES_DB: agentbase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentbase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Install locked dev dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -r requirements-dev.lock --require-hashes
      - name: Run the shared storage contract suite against real services
        env:
          AGENT_TEST_REAL_REDIS_URL: redis://127.0.0.1:6379/0
          AGENT_TEST_REAL_POSTGRES_DSN: postgresql://agentbase:agentbase@127.0.0.1:5432/agentbase
        run: .venv/bin/python -m pytest tests/test_storage/test_contract.py -q
